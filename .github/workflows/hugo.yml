name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  # Publishing to the gh-pages branch is a push to this repository, not a Pages
  # artifact upload, so this needs contents:write rather than pages/id-token.
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build site
        uses: ./.github/actions/build-site
        # No base-url: production uses the baseURL configured in hugo.yml.

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          # Production owns the branch root but must leave PR previews alone.
          clean-exclude: pr-preview/
          # Force-pushing would clobber previews deployed since this build
          # started; rebase onto them instead.
          force: false
