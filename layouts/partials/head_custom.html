<!--
Convert the onclick to onhover for the menu drop downs
-->
<style>
  /* Desktop only */
@media (min-width: 768px) {
  .navbar .dropdown:hover > .dropdown-menu {
    display: block;
  }

  .navbar .dropdown-menu {
    margin-top: 0;
  }
}
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
  if (window.innerWidth >= 768) {
    document.querySelectorAll(".navbar .dropdown").forEach(function(dropdown) {
      dropdown.addEventListener("mouseenter", function() {
        this.classList.add("open", "show");
        const menu = this.querySelector(".dropdown-menu");
        if (menu) menu.classList.add("show");
      });

      dropdown.addEventListener("mouseleave", function() {
        this.classList.remove("open", "show");
        const menu = this.querySelector(".dropdown-menu");
        if (menu) menu.classList.remove("show");
      });
    });
  }
});
</script>

<!--
YouTube video resizing
-->
<style>
  .embed-responsive {
    position: relative;
    display: block;
    height: 0;
    padding: 0;
    overflow: hidden;
  }
  .embed-responsive .embed-responsive-item,
  .embed-responsive iframe,
  .embed-responsive embed,
  .embed-responsive object,
  .embed-responsive video {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .embed-responsive.embed-responsive-16by9 {
    padding-bottom: 56.25%;
  }
  .embed-responsive.embed-responsive-4by3 {
    padding-bottom: 75%;
  }
</style>

<!--

<!--
Code block readability: alternating line stripes + left accent border
-->
<style>
:root {
  --code-line-odd: #f9f9f9;
  --code-line-even: #fdfdfd;
  --code-line-height: 1.6em;
  --code-border-left: #444;
}

[data-theme="dark"] {
  --code-line-odd: #131922;
  --code-line-even: #0f141c;
  --code-border-left: #7d8590;
}

.highlight {
  border-left: 7px solid var(--code-border-left);
  border-radius: 4px;
  overflow: hidden;
}

.highlight > pre,
.highlight > .chroma,
.highlight .lntd pre,
pre code.hljs,
pre:not(.chroma) > code:not(.hljs) {
  background-color: var(--code-line-even);
  background-image: linear-gradient(var(--code-line-odd) 50%, var(--code-line-even) 50%);
  background-repeat: repeat;
  background-size: 100% calc(var(--code-line-height) * 2);
  background-position: 0 0;
  line-height: var(--code-line-height);
}
</style>

<!--
Form styling to match BeautifulHugo's Bootstrap theme
-->
<style>
  :root {
    --pdf-form-bg: rgba(255, 255, 255, 0.75);
    --pdf-form-border: #dfe3e8;
    --pdf-form-field-bg: #ffffff;
    --pdf-form-text: #1f2937;
    --pdf-form-muted: #5c697a;
    --pdf-form-focus: #0d6efd;
  }

  [data-theme="dark"] {
    --pdf-form-bg: rgba(17, 24, 39, 0.6);
    --pdf-form-border: #3b4759;
    --pdf-form-field-bg: #0f172a;
    --pdf-form-text: #edf2f7;
    --pdf-form-muted: #c5d0df;
    --pdf-form-focus: #7cb4ff;
  }

  .pdf-form {
    margin: 2rem auto;
    padding: 2rem;
    border: 1px solid var(--pdf-form-border);
    border-radius: 14px;
    background: var(--pdf-form-bg);
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }

  .pdf-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.25rem;
  }

  .pdf-form-field {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    font-weight: 600;
    color: var(--pdf-form-text);
  }

  .pdf-form-field-full {
    grid-column: 1 / -1;
  }

  .pdf-form-field span {
    font-size: 0.95rem;
  }

  .pdf-form textarea,
  .pdf-form input,
  .pdf-form select {
    width: 100%;
    min-height: 44px;
    padding: 0.75rem 0.875rem;
    border: 1px solid var(--pdf-form-border);
    border-radius: 10px;
    background: var(--pdf-form-field-bg);
    color: var(--pdf-form-text);
    font: inherit;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .pdf-form textarea {
    min-height: 120px;
    resize: vertical;
  }

  .pdf-form textarea:focus,
  .pdf-form input:focus,
  .pdf-form select:focus {
    border-color: var(--pdf-form-focus);
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    outline: none;
  }

  .pdf-form-fieldset {
    margin-top: 1.5rem;
    padding: 1.25rem 1rem 0.5rem;
    border: 1px solid var(--pdf-form-border);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.02);
  }

  .pdf-form-fieldset legend {
    float: none;
    width: auto;
    padding: 0 0.5rem;
    font-size: 1rem;
    font-weight: 700;
    color: var(--pdf-form-text);
  }

  .pdf-form-radio-group {
    display: grid;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  .pdf-form-option {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--pdf-form-border);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--pdf-form-text);
    cursor: pointer;
  }

  .pdf-form-option input {
    width: auto;
    min-height: auto;
    margin: 0;
  }

  .signature-panel {
    position: relative;
    margin-top: 0.75rem;
  }

  .signature-pad {
    display: block;
    width: 100%;
    height: 180px;
    border: 1px solid var(--pdf-form-border);
    border-radius: 10px;
    background: #ffffff;
  }

  .pdf-form-actions {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 1;
    display: flex;
    justify-content: center;
  }

  .pdf-form-submit-row {
    display: flex;
    justify-content: center;
    margin-top: 1.5rem;
  }

  @media (max-width: 576px) {
    .pdf-form {
      padding: 1.25rem;
      margin: 1rem 0;
    }

    .pdf-form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
